name: Image Docker

# Construit l'image de production sur le runner GitHub plutôt que sur le VPS,
# dont la mémoire est partagée avec d'autres applications. L'image est publiée
# comme artefact, puis chargée sur le serveur avec `docker load`.
on:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: garageflow:${{ github.sha }}
          outputs: type=docker,dest=/tmp/garageflow.tar
      - run: gzip -1 /tmp/garageflow.tar && ls -lh /tmp/garageflow.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: garageflow-image
          path: /tmp/garageflow.tar.gz
          retention-days: 3
          compression-level: 0
