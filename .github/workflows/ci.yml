name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/garageflow?schema=public
  APP_URL: http://localhost:3000
  APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef0123456789
  APPROVAL_LINK_TTL_HOURS: "72"
  STORAGE_DRIVER: local
  STORAGE_LOCAL_DIR: ./storage
  MAIL_TRANSPORT: log

jobs:
  check:
    name: Lint · Typecheck · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: garageflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Créer la base de test
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE garageflow_test;"
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Tests unitaires + intégration
        run: pnpm test
      - name: Migrations (base de dev)
        run: pnpm db:deploy
      - run: pnpm build
      - name: Playwright (E2E)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
